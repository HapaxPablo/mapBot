<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>GeoMap</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .popup {
            max-width: 220px;
        }

        .popup img {
            width: 200px;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .popup-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .popup-meta {
            font-size: 12px;
            color: #666;
        }
    </style>

</head>

<body>

<div id="map"></div>


<script>

    const API_URL = "/api/points/";

    const STYLE_URL =
        "https://api1.krasrm.com/maps/styles/basic/style.json";


    // Красноярск
    const CENTER = [
        92.8672,
        56.0184
    ];


    // границы города примерно
    const KRASNOYARSK_BOUNDS = [
        [
            92.3,
            55.5
        ],
        [
            93.5,
            56.5
        ]
    ];


    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }


    const map = new maplibregl.Map({

        container: "map",

        style: STYLE_URL,

        center: CENTER,

        zoom: 12,


        minZoom: 10,
        maxZoom: 17,


        maxBounds: KRASNOYARSK_BOUNDS,


        attributionControl: false
    });


    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


    const markers = [];


    async function loadPoints() {

        try {

            const response = await fetch(API_URL);


            if (!response.ok) {
                throw new Error(
                    "API error " + response.status
                );
            }


            const data = await response.json();


            const points =
                data.results ?? data;


            const bounds =
                new maplibregl.LngLatBounds();


            points.forEach(point => {


                const el =
                    document.createElement("div");


                el.style.width = "18px";
                el.style.height = "18px";
                el.style.borderRadius = "50%";
                el.style.background = "#ef4444";
                el.style.border = "3px solid white";
                el.style.cursor = "pointer";


                const popup =
                    new maplibregl.Popup({
                        offset: 20
                    })
                        .setHTML(`

                    <div class="popup">


                    ${
                            point.photo_url
                                ?
                                `
                        <img src="${point.photo_url}">
                        `
                                :
                                ""
                        }


                    <div class="popup-title">
                        ${escapeHtml(point.title)}
                    </div>


                    ${
                            point.description
                                ?
                                `<div>
                            ${escapeHtml(point.description)}
                        </div>`
                                :
                                ""
                        }


                    <div class="popup-meta">

                        👍 ${point.likes}
                        ·
                        👎 ${point.dislikes}


                        ${
                            point.username
                                ?
                                " · " + escapeHtml(point.username)
                                :
                                ""
                        }

                    </div>


                    </div>

                `);


                new maplibregl.Marker({
                    element: el
                })
                    .setLngLat([
                        point.lng,
                        point.lat
                    ])
                    .setPopup(popup)
                    .addTo(map);


                bounds.extend([
                    point.lng,
                    point.lat
                ]);

            });


            if (points.length) {

                map.fitBounds(
                    bounds,
                    {
                        padding: 50,
                        maxZoom: 14
                    }
                );

            }


        } catch (error) {

            console.error(
                "Ошибка загрузки точек:",
                error
            );

        }

    }


    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }


    map.on(
        "load",
        () => {

            loadPoints();

        }
    );


</script>


</body>
</html>
