<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>GeoMap</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
            href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
            rel="stylesheet"
    />

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .marker {
            width: 34px;
            height: 34px;
            background: #ef4444;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
        }

        .popup {
            max-width: 240px;
        }

        .popup img {
            width: 220px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }

        .popup h3 {
            margin: 8px 0;
            font-size: 16px;
        }

        .popup p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="map"></div>


<script>

    const API_URL = '/api/points/';

    const STYLE_URL =
        'https://api1.krasrm.com/maps/styles/basic/style.json';


    // Красноярск
    const CENTER = [
        92.8672,
        56.0184
    ];


    const map = new maplibregl.Map({

        container: 'map',

        style: STYLE_URL,

        center: CENTER,

        zoom: 12,

        minZoom: 10,

        maxZoom: 17,

        attributionControl: false

    });


    map.addControl(
        new maplibregl.NavigationControl(),
        'top-right'
    );


    function escapeHtml(value = '') {

        const div = document.createElement('div');

        div.textContent = value;

        return div.innerHTML;
    }


    async function loadPoints() {

        try {

            const response = await fetch(API_URL);

            const data = await response.json();


            const points = data.results ?? data;


            points.forEach(point => {


                if (!point.lat || !point.lng) {
                    return;
                }


                const el = document.createElement('div');

                el.className = 'marker';


                const popupHTML = `

                <div class="popup">

                    ${
                    point.photo_url
                        ?
                        `<img src="${escapeHtml(point.photo_url)}">`
                        :
                        ''
                }


                    <h3>
                        ${escapeHtml(point.title)}
                    </h3>


                    <p>
                        ${escapeHtml(point.description || '')}
                    </p>

                </div>

            `;


                const popup = new maplibregl.Popup({
                    offset: 20
                })
                    .setHTML(popupHTML);


                new maplibregl.Marker({
                    element: el
                })
                    .setLngLat([
                        point.lng,
                        point.lat
                    ])
                    .setPopup(popup)
                    .addTo(map);


            });


        } catch (error) {

            console.error(
                'Points loading error',
                error
            );

        }

    }


    map.on('style.load', () => {


        /*
           Убираем зависимость от glyphs MapTiler.
           Некоторые стили приходят с:
           glyphs: https://api.maptiler.com/fonts/...
        */

        if (map.getStyle().glyphs) {

            map.getStyle().glyphs = undefined;

        }


    });


    map.on('load', () => {

        loadPoints();

    });


</script>


</body>
</html>
