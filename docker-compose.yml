services:
  nginx:
    image: nginx:alpine
    container_name: geomap-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      geomap-backend:
        condition: service_healthy
      geomap-minio:
        condition: service_healthy
      geomap-webapp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  geomap-db:
    image: postgres:18.3
    container_name: geomap_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
    volumes:
      - geomap_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  geomap-redis:
    image: redis:7-alpine
    container_name: geomap_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  geomap-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: geomap_minio
    env_file: ./.env
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - geomap_minio_data:/data
    ports:
      - 127.0.0.1:9010:9000
      - 127.0.0.1:9011:9001
    restart: unless-stopped

  geomap-webapp:
    build:
      context: ./webapp
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_MAP_STYLE_URL=${VITE_MAP_STYLE_URL}
    container_name: geomap_webapp
    ports:
      - 127.0.0.1:8020:80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  geomap-backend:
    build: ./backend
    container_name: geomap_backend
    env_file: ./.env
    ports:
      - 127.0.0.1:8010:8010
    volumes:
      - ./backend/staticfiles:/app/staticfiles
    environment:
      - REDIS_URL=redis://geomap-redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      geomap-db:
        condition: service_healthy
      geomap-minio:
        condition: service_healthy
      geomap-redis:
        condition: service_healthy
    restart: unless-stopped

  geomap-bot:
    build: ./bot
    container_name: geomap_bot
    env_file: ./.env
    environment:
      - REDIS_URL=redis://geomap-redis:6379/1
    depends_on:
      geomap-backend:
        condition: service_healthy
      geomap-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  geomap_db_data:
  geomap_minio_data:
